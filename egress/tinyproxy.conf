Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 50
PidFile "/tmp/tinyproxy.pid"
# -d keeps tinyproxy in the foreground; with no LogFile/Syslog it logs to stderr (docker logs).
LogLevel Connect
DisableViaHeader Yes

# Only TLS tunnels to port 443.
ConnectPort 443

# Deny everything except the hosts in /etc/tinyproxy/filter.
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
FilterCaseSensitive Off
